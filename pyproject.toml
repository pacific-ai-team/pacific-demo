[tool.poetry]
name = "personal-search-demo"
version = "0.1.0"
description = "FastAPI demo for personal search with reranking and LLM summarization."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
fastapi = ">=0.115.12"
uvicorn = {extras = ["standard"], version = ">=0.34.2"}
pydantic = ">=2.11.4"
pydantic-ai = "^0.2.5"
openai = ">=1.79.0"
python-dotenv = ">=1.0.0"
jinja2 = "^3.1.6"
# Security constraints
starlette = ">=0.49.1" # CVE-2025-62727
mcp = ">=1.23.0" # CVE-2025-66416
urllib3 = ">=2.6.3" # CVE-2025-66418, CVE-2025-66471, CVE-2026-21441
pyasn1 = ">=0.6.3,<1" # CVE-2026-23490, CVE-2026-30922
pyjwt = ">=2.12.0,<3" # CVE-2026-32597
python-multipart = ">=0.0.22" # CVE-2026-24486

[tool.poetry.group.dev.dependencies]
# Add development dependencies here if needed, e.g.:
# pytest = "^7.0"
# black = "^23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 